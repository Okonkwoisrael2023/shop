<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor-Store</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>
<body>
    
    <section class="body">

        <div class="hero">

            <img src="img.jpg" alt="" srcset="" class="back-img">

            <div class="dynamic">
                <div class="logo">
                    <img src="logo.png" alt="" srcset="">
                </div>

                <div class="nav">
                    <a href="index.html">Home</a>
                    <a href="#Carts">Cart</a>
                    <a href="#contact">Contact</a>
                    <a href="#privacy">Privacy</a>
                </div>
            </div>

            <div class="content">

                <div class="write-up">
                    <h1> Welcome!</h1>
                    <h2>To where you connet to luxury <span class="tx1">interior</span></h2>
                    <button>Buy Now!</button>
                     
                </div> 
            </div>

        </div>


        
        <section class="product-highlights">
           <div class="highlights-header">
              <h2>Featured Products</h2>
              <p>Discover our most popular picks this week.</p>
            </div>

           <div class="product-grid">

             <!--  Card 1 -->
           <div class="product-card">
               <div class="product-image">
                  <img src="pro1.jpg" alt="">
                </div>

                <div class="product-info">
                      <h3 class="product-title">bubble</h3>
                       <p class="product-price">
                       <span class="current-price">$120.00</span>
                       <span class="old-price">$150.00</span>
                       </p>
                      <button class="add-to-cart">Add to Cart</button>
                </div>
          </div>
 
              <!-- Card 2 -->
               <div class="product-card">

                 <div class="product-image">
                   <img src="pro2.jpg" alt="">
                 </div>

                 <div class="product-info">
                        <h3 class="product-title">Calm</h3>
                        <p class="product-price">
                        <span class="current-price">$85.00</span>
                        </p>
                        <button class="add-to-cart">Add to Cart</button>

                    </div>
               </div>
                    <!-- Product Card 3 -->
                     <div class="product-card">
                        <div class="product-image">
                          <img src="pro3.jpg" alt="">
                       </div>

                       <div class="product-info">
                            <h3 class="product-title">Couch by Ashley</h3>
                            <p class="product-price">
                            <span class="current-price">$65.00</span>
                            </p>
                            <button class="add-to-cart">Add to Cart</button>
                        </div>
                    </div>
        </section>

        <div class="footer">
            <div class="write-up">
                <h2>Hope You Enjoyed Your Stay</h2> 
            </div>

            <div class="link">
                <a href="">Privacy</a>
                <a href="">Contact</a>
                <button></button>
            </div>
        </div>
                
    </section>








    <script src="script.js"></script>
</body>
</html>
